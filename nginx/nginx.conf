events {
    worker_connections 1024;
    # how many simultaneous connections one nginx worker can handle
}

http {

    # "upstream" defines the backend server(s) Go app is running on
    # if you had multiple Go instances, you'd list them all here
    # and Nginx would load balance between them automatically
    upstream go_app {
        server app:8080;
        # "app" = the service name in docker-compose.yml
        # "8080" = the port Go is listening on INSIDE the container
    }

    server {
        listen 80;
        # Nginx listens on port 80 (HTTP)

        # access log — every request gets logged here
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;

        # rate limiting zone — max 10 requests per second per IP
        # this protects your API from being hammered
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

        location / {
            # forward ALL requests to the Go app upstream
            proxy_pass http://go_app;

            # these headers tell Go the REAL client IP and protocol
            # without these, Go would think all requests come from Nginx
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # apply rate limiting
            limit_req zone=api_limit burst=20 node  lay;
            # burst=20: allow short bursts of 20 requests
            # nodelay: don't queue — reject immediately if over limit
        }
    }
}